services:
  auth:
    environment:
      GOTRUE_SECURITY_CAPTCHA_ENABLED: "false"
      GOTRUE_SECURITY_CAPTCHA_PROVIDER: ""
      GOTRUE_SECURITY_CAPTCHA_SECRET: ""

  nextjs:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    command: sh -c "corepack enable && (test -x node_modules/.bin/next || pnpm install) && pnpm build && mkdir -p .next/standalone/public .next/standalone/.next/static && cp -r public/. .next/standalone/public/ && cp -r .next/static/. .next/standalone/.next/static/ && HOSTNAME=0.0.0.0 PORT=3000 node .next/standalone/server.js"
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_TURNSTILE_ENABLED: "false"
      NEXT_PUBLIC_SIGNUP_OTP_ENABLED: ${SIGNUP_OTP_ENABLED:-false}
      SIGNUP_OTP_ENABLED: ${SIGNUP_OTP_ENABLED:-false}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8100}
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      SUPABASE_URL: http://kong:8100
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASS}
    volumes:
      - ./metric-app:/app
      - nextjs_node_modules:/app/node_modules
      - nextjs_cache:/app/.next
    depends_on:
      api-gw:
        condition: service_healthy

volumes:  
  nextjs_node_modules:
  nextjs_cache:
